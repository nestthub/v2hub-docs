[project]
site_name = "V2Hub Documentation"
site_description = "Official documentation for the V2Hub developer ecosystem."
site_url = "https://v2hub.dev"

repo_url = "https://github.com/nestthub/v2hub-docs"

extra_css = ["assets/extra.css"]

nav = [
    { "Home" = "index.md" },
    { "Getting Started" = "getting-started/index.md"},
    { "V2Hub" = [
        { "Overview" = "v2hub/index.md" },
        { "Installation & Setup" = "v2hub/installation.md" },
        { "Sync & Async Clients" = "v2hub/clients.md" },
        { "Requests & Responses" = "v2hub/requests-responses.md" },
        { "Typed Models" = "v2hub/models.md" },
        { "Error Handling" = "v2hub/errors.md" },
        { "Retries & Circuit Breaker" = "v2hub/retries.md" },
        { "Usage Examples" = "v2hub/examples.md" },
        { "API Reference" = "v2hub/reference.md" },
    ] },
    { "V2Hub Admin" = [
        { "Overview" = "v2hub-admin/index.md" },
        { "Installation & Setup" = "v2hub-admin/installation.md" },
        { "Authentication & Authorization" = "v2hub-admin/authentication.md" },
        { "User Management" = "v2hub-admin/user-management.md" },
        { "Provider Management" = "v2hub-admin/provider-management.md" },
        { "Provider Authorization" = "v2hub-admin/provider-authorization.md" },
        { "IP Bans & Whitelist" = "v2hub-admin/ip-bans-and-whitelist.md" },
        { "Usage Statistics" = "v2hub-admin/usage-statistics.md" },
        { "Integration Examples" = "v2hub-admin/examples.md" },
        { "API Reference" = "v2hub-admin/reference.md" },
    ] },
    { "V2Hub CLI" = [
        { "Overview" = "v2hub-cli/index.md" },
        { "Installation" = "v2hub-cli/installation.md" },
        { "Configuration & Authentication" = "v2hub-cli/configuration.md" },
        { "Shell Autocompletion" = "v2hub-cli/autocompletion.md" },
        { "Subscription Commands" = "v2hub-cli/subscription-commands.md" },
        { "Connection Commands" = "v2hub-cli/connection-commands.md" },
        { "Provider Commands" = "v2hub-cli/provider-commands.md" },
        { "Admin Commands" = "v2hub-cli/admin-commands.md" },
        { "Common Workflows & Examples" = "v2hub-cli/examples.md" },
        { "Command Reference" = "v2hub-cli/reference.md" },
    ] },
]

[project.theme]
variant = "modern"
logo = "images/logo.svg"
favicon = "images/logo.svg"
features = [
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "content.code.copy",
    "content.tooltips",
    "content.action.edit",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "indigo"

[project.extra]
generator = false
